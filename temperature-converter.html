<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | Stephen Banagale</title>
    <meta name="description" content="Celsius and Fahrenheit converter, ported from a C# console app to the web.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <script>
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
        } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>

    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --muted: #d0d0d0;
            --placeholder: #888;
            --header-bg: rgba(0, 0, 0, 0.85);
            --header-solid: #000;
            --card-bg: rgba(30, 144, 255, 0.05);
            --card-hover: rgba(30, 144, 255, 0.12);
            --card-border: rgba(30, 144, 255, 0.35);
            --card-shadow: 0 0 30px rgba(30, 144, 255, 0.15);
            --scroll-track: #050a14;
            --blob-1: rgba(30, 144, 255, 0.10);
            --blob-2: rgba(30, 144, 255, 0.07);
            --blob-3: rgba(30, 144, 255, 0.08);
        }

        [data-theme="light"] {
            --bg: #f3f8ff;
            --text: #0b1a2e;
            --muted: #44546a;
            --placeholder: #7a8aa0;
            --header-bg: rgba(255, 255, 255, 0.85);
            --header-solid: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-hover: rgba(30, 144, 255, 0.12);
            --card-border: rgba(30, 144, 255, 0.4);
            --card-shadow: 0 8px 25px rgba(30, 144, 255, 0.15);
            --scroll-track: #e3eefc;
            --blob-1: rgba(30, 144, 255, 0.07);
            --blob-2: rgba(0, 212, 255, 0.05);
            --blob-3: rgba(30, 144, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        h1, h2, h3, .logo, .result-value {
            font-family: 'Space Grotesk', 'Poppins', sans-serif;
        }

        html {
            font-size: 62.5%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at 15% 10%, var(--blob-1), transparent 30%),
                radial-gradient(circle at 65% 50%, var(--blob-2), transparent 30%),
                radial-gradient(circle at 20% 60%, var(--blob-3), transparent 30%);
        }

        ::-webkit-scrollbar { width: 1rem; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: dodgerblue; border-radius: 1rem; }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 0.3rem solid dodgerblue;
            outline-offset: 0.4rem;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2rem 9%;
            background-color: var(--header-bg);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo {
            font-size: 3rem;
            color: dodgerblue;
            font-weight: 800;
            transition: 0.5s ease;
            text-shadow: 0 0 15px rgba(30, 144, 255, 0.6);
        }

        .logo:hover { transform: scale(1.1); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .back-link {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text);
            padding: 1rem;
            border-bottom: 3px solid transparent;
            transition: 0.3s ease;
        }

        .back-link:hover {
            color: dodgerblue;
            border-bottom: 3px solid dodgerblue;
        }

        .theme-toggle {
            width: 4.2rem;
            height: 4.2rem;
            font-size: 2rem;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: 0.2rem solid dodgerblue;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .theme-toggle:hover {
            background: dodgerblue;
            box-shadow: 0 0 20px dodgerblue;
            transform: rotate(20deg);
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12rem 5% 6rem;
        }

        .heading {
            font-size: 5rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .heading span {
            color: dodgerblue;
            text-shadow: 0 0 15px rgba(30, 144, 255, 0.6);
        }

        .subtitle {
            font-size: 1.6rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 4rem;
        }

        .converter {
            width: 100%;
            max-width: 52rem;
            padding: 4rem 3.5rem;
            border: 0.2rem solid var(--card-border);
            border-radius: 2.5rem;
            background-color: var(--card-bg);
            backdrop-filter: blur(8px);
            box-shadow: var(--card-shadow);
            transition: 0.3s ease;
        }

        .converter:hover {
            border-color: dodgerblue;
            box-shadow: 0 0 25px dodgerblue;
        }

        .field-label {
            display: block;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 1rem;
        }

        .mode {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .mode-btn {
            padding: 1.4rem 1rem;
            font-size: 1.6rem;
            font-weight: 600;
            color: dodgerblue;
            background: transparent;
            border: 0.2rem solid dodgerblue;
            border-radius: 5rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .mode-btn:hover {
            transform: translateY(-0.3rem);
            box-shadow: 0 0 20px dodgerblue;
        }

        .mode-btn[aria-pressed="true"] {
            background: dodgerblue;
            color: #fff;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.6);
        }

        .input-wrap {
            position: relative;
            margin-bottom: 3rem;
        }

        .input-wrap input {
            width: 100%;
            padding: 1.8rem 6rem 1.8rem 2.5rem;
            font-size: 2.2rem;
            font-weight: 500;
            color: var(--text);
            background-color: var(--card-bg);
            border: 0.2rem solid var(--card-border);
            border-radius: 1.5rem;
            transition: 0.3s ease;
        }

        .input-wrap input::placeholder { color: var(--placeholder); }

        .input-wrap input:focus {
            border-color: dodgerblue;
            box-shadow: 0 0 15px dodgerblue;
        }

        .unit-tag {
            position: absolute;
            right: 2.5rem;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: dodgerblue;
            pointer-events: none;
        }

        .result {
            text-align: center;
            padding: 3rem 2rem;
            border: 0.2rem solid var(--card-border);
            border-radius: 2rem;
            background-color: var(--card-hover);
            margin-bottom: 3rem;
            min-height: 15rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
        }

        .result-label {
            font-size: 1.4rem;
            color: var(--muted);
        }

        .result-value {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1.1;
            color: dodgerblue;
            text-shadow: 0 0 15px rgba(30, 144, 255, 0.6);
            word-break: break-all;
        }

        .result-value.is-error {
            font-size: 2rem;
            line-height: 1.5;
            color: #ff4d4d;
            text-shadow: none;
        }

        .result-formula {
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            color: var(--muted);
            min-height: 2rem;
        }

        .actions {
            display: flex;
            gap: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 1.5rem 2rem;
            font-size: 1.6rem;
            font-weight: 600;
            text-align: center;
            border-radius: 5rem;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-primary {
            color: #fff;
            background-color: dodgerblue;
        }

        .btn-outline {
            color: dodgerblue;
            background: transparent;
            border: 0.2rem solid dodgerblue;
        }

        .btn:hover {
            transform: translateY(-0.4rem);
            box-shadow: 0 0 25px dodgerblue;
        }

        .btn-outline:hover {
            background: dodgerblue;
            color: #fff;
        }

        .footer {
            text-align: center;
            padding: 3rem 9%;
            border-top: 0.2rem solid var(--card-border);
            font-size: 1.6rem;
            color: var(--muted);
        }

        @media (max-width: 995px) {
            header { padding: 1.5rem 5%; background-color: var(--header-solid); }
            .logo { font-size: 2.6rem; }
            .header-actions { gap: 1.2rem; }
            .back-link { font-size: 1.4rem; padding: 0.6rem; white-space: nowrap; }
            .theme-toggle { width: 3.8rem; height: 3.8rem; font-size: 1.8rem; }
        }

        @media (max-width: 600px) {
            .heading { font-size: 3.4rem; }
            .converter { padding: 3rem 2rem; }
            .result-value { font-size: 4rem; }
            .actions { flex-direction: column; }
            .footer { font-size: 1.3rem; }
        }

        @media (max-width: 480px) {
            .logo { font-size: 2.2rem; }
            .header-actions { gap: 0.8rem; }
            .back-link { font-size: 1.2rem; padding: 0.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Rockwel</a>
        <div class="header-actions">
            <a href="index.html#projects" class="back-link">← Back to Portfolio</a>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark or light mode">🌙</button>
        </div>
    </header>

    <main>
        <h1 class="heading">Temperature <span>Converter</span></h1>
        <p class="subtitle">Convert between Celsius and Fahrenheit.</p>

        <div class="converter">
            <span class="field-label" id="mode-label">What do you want to convert?</span>
            <div class="mode" role="group" aria-labelledby="mode-label">
                <button type="button" class="mode-btn" id="mode-c" aria-pressed="true">°C → °F</button>
                <button type="button" class="mode-btn" id="mode-f" aria-pressed="false">°F → °C</button>
            </div>

            <label class="field-label" for="temp">Enter a temperature</label>
            <div class="input-wrap">
                <input type="text" id="temp" inputmode="decimal" placeholder="0" autocomplete="off">
                <span class="unit-tag" id="unit-tag">°C</span>
            </div>

            <div class="result" aria-live="polite">
                <span class="result-label">The new temperature is</span>
                <span class="result-value" id="result-value">—</span>
                <span class="result-formula" id="result-formula"></span>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-primary" id="swap">Swap</button>
                <button type="button" class="btn btn-outline" id="clear">Clear</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Stephen Rockwel Banagale. All rights reserved.</p>
    </footer>

    <script>
        const themeToggle = document.getElementById('theme-toggle');

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '🌙' : '☀️';
            try { localStorage.setItem('theme', theme); } catch (e) {}
        }

        applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        function celsiusToFahrenheit(cel) {
            return (cel * 9 / 5) + 32;
        }

        function fahrenheitToCelsius(fah) {
            return (fah - 32) * 5 / 9;
        }

        const input = document.getElementById('temp');
        const unitTag = document.getElementById('unit-tag');
        const resultValue = document.getElementById('result-value');
        const resultFormula = document.getElementById('result-formula');
        const modeC = document.getElementById('mode-c');
        const modeF = document.getElementById('mode-f');
        const swapBtn = document.getElementById('swap');
        const clearBtn = document.getElementById('clear');

        let mode = 'c';

        function format(n) {
            return String(Number(n.toFixed(2)));
        }

        function showResult(text, formula, isError) {
            resultValue.textContent = text;
            resultValue.classList.toggle('is-error', Boolean(isError));
            resultFormula.textContent = formula || '';
        }

        function convert() {
            const raw = input.value.trim().replace(',', '.');

            if (raw === '') {
                showResult('—', '');
                return null;
            }

            const n = Number(raw);

            if (!Number.isFinite(n)) {
                showResult('Please enter a valid number.', '', true);
                return null;
            }

            if (mode === 'c') {
                if (n < -273.15) {
                    showResult('That is below absolute zero (−273.15 °C).', '', true);
                    return null;
                }
                const out = celsiusToFahrenheit(n);
                showResult(format(out) + ' °F', '(' + format(n) + ' × 9/5) + 32 = ' + format(out));
                return out;
            }

            if (n < -459.67) {
                showResult('That is below absolute zero (−459.67 °F).', '', true);
                return null;
            }
            const out = fahrenheitToCelsius(n);
            showResult(format(out) + ' °C', '(' + format(n) + ' − 32) × 5/9 = ' + format(out));
            return out;
        }

        function setMode(next) {
            mode = next;
            modeC.setAttribute('aria-pressed', String(next === 'c'));
            modeF.setAttribute('aria-pressed', String(next === 'f'));
            unitTag.textContent = next === 'c' ? '°C' : '°F';
            convert();
        }

        modeC.addEventListener('click', () => setMode('c'));
        modeF.addEventListener('click', () => setMode('f'));
        input.addEventListener('input', convert);

        swapBtn.addEventListener('click', () => {
            const out = convert();
            setMode(mode === 'c' ? 'f' : 'c');
            if (out !== null) {
                input.value = format(out);
                convert();
            }
            input.focus();
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            convert();
            input.focus();
        });

        input.focus();
    </script>
</body>
</html>
